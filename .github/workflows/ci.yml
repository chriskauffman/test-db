---
name: Lint and Test

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
      - "release/*"
    paths:
      - .github/workflows/**
      - release-please-config.json
      - .release-please-manifest.json
      - uv.lock
      - pyproject.toml
      - src/**
      - tests/**
      - Makefile
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Run Tests for supported Python versions
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        # v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: make test
  quality:
    name: Lint, Type Check and Migration Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        # v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install the project dependencies
        run: uv sync --locked --all-groups
      - name: Run lint and type checks
        run: make lint type-check test-migration-sqlite
  security:
    name: Security Audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        # v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install the project dependencies
        run: uv sync --locked --all-groups
      - name: Run security audit
        run: uv audit
  build:
    name: Build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [python, quality, security]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        # v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install the project dependencies
        run: uv sync --locked --all-groups
      - name: Generate schema
        run: make src/test_db/_schemas/v2.sql
      - name: Build package
        run: uv build
